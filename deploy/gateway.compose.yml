# Server Management Console — agent gateway
#
# Milestone A. Telemetry only. No Docker socket, not privileged, no host
# networking, and no Convex admin key.
#
# The published address is the Tailscale IP ONLY. It is never 0.0.0.0, never
# [::], and never the LAN address. The gateway binary additionally refuses to
# start if its listen address is not inside 100.64.0.0/10.
services:
  smc-gateway:
    build:
      context: /tmp/smc-gwbuild
      dockerfile: gateway.Dockerfile
    image: smc-gateway:0.1.0
    container_name: smc-gateway
    restart: unless-stopped
    stop_grace_period: 10s

    command:
      - -listen=100.80.65.109:8446
      - -cert=/etc/smc-gateway/tls/gateway.crt
      - -key=/etc/smc-gateway/tls/gateway.key
      - -ca=/etc/smc-gateway/tls/agents-ca.crt
      - -ingest-url=https://gman-02.tail0ab69b.ts.net:8443/api/smc/ingest
      - -ingest-secret-file=/etc/smc-gateway/ingest.secret

    # Tailscale address only. Adding 0.0.0.0 or the LAN IP here would expose the
    # control plane's agent channel to the whole local network.
    ports:
      - "100.80.65.109:8446:8446"

    volumes:
      # Read-only mounts of protected material. The container user (uid 20001)
      # reads the gateway key through a group-readable copy made at install time.
      - /srv/platform/agent-gateway/tls-read:/etc/smc-gateway/tls:ro
      - /srv/platform/agent-gateway/ingest.secret.read:/etc/smc-gateway/ingest.secret:ro

    # Isolation.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "20001:20001"

    # Explicit, and deliberately small: the host has 4 logical CPUs shared
    # with Convex, Caddy and SchoolCore.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 128
        reservations:
          memory: 48M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
